<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Ifra site</title>
<style>
:root{--bg:#1b0710;--panel:#2a0d1a;--line:#4a1a30;--txt:#fbe9ef;--mut:#c9a0b0;--acc:#ff4d6d;--ok:#4cc38a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:10}
#gate form{background:var(--panel);padding:28px;border-radius:14px;border:1px solid var(--line);width:min(340px,90vw);text-align:center}
header{position:sticky;top:0;z-index:5;background:#12040b;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;margin-right:auto}
#status{font-size:12px;color:var(--ok)}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:#16050c}
nav button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13px}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{max-width:900px;margin:0 auto;padding:16px 14px 80px}
h2{margin:6px 0 4px}h3{margin:18px 0 6px;color:#ffb3c4}
.hint{color:var(--mut);font-size:13px;margin:0 0 12px}
label.f{display:block;margin:8px 0}
label.f>span{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,textarea,select{width:100%;background:#12040b;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
textarea{resize:vertical}
button.b{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
button.b.alt{background:#3a1526;border:1px solid var(--line)}
button.b.sm{padding:4px 10px;font-size:13px}
button.b.del{background:#7a1d33}
details.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:7px 0}
details.item>summary{padding:9px 12px;cursor:pointer;list-style:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.item[open]>summary{border-bottom:1px solid var(--line)}
.body{padding:6px 12px 12px}
.ctl{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.photo{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.photo img{width:110px;height:110px;object-fit:cover;border-radius:8px;background:#000;flex:none}
.photo .r{flex:1;min-width:0}
.tag{font-size:11px;background:#3a1526;border-radius:6px;padding:1px 6px;color:var(--mut)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
code{background:#12040b;padding:1px 5px;border-radius:5px}
ol{padding-left:20px}
</style>
</head>
<body>

<div id="gate" style="display:flex">
  <form onsubmit="return unlock(event)">
    <h2 id="gateTitle">🔐 Admin Sign In</h2>
    <p class="hint">Enter Tayyab's master password or Ifra's login</p>
    <input type="text" id="user" autocomplete="username" placeholder="Username (optional for Tayyab, e.g. ifra)" style="margin-bottom:8px">
    <input type="password" id="pass" autocomplete="current-password" placeholder="Password" autofocus>
    <p id="gateErr" style="color:#ff8aa0;min-height:20px;margin:8px 0"></p>
    <button class="b" type="submit" id="gateBtn" style="width:100%">Sign in</button>
  </form>
</div>

<header>
  <h1 id="panelTitle">🌹 Ifra site · Admin panel</h1>
  <span id="status">Ready</span>
  <button class="b alt sm" onclick="preview()">👁 Preview</button>
  <button class="b alt sm" id="lockNow" style="display:none" onclick="lockNow()">🔒 Lock now</button>
  <button class="b sm" id="pubTop" onclick="publish()">🚀 Publish live</button>
  <button class="b alt sm" onclick="signOut()" style="margin-left:auto">🚪 Sign out</button>
</header>
<nav id="tabs"></nav>
<main id="main"></main>

<script src="content.js"></script>
<script src="/api/live.js"></script>
<script>
let TOKEN=sessionStorage.getItem('ifraToken')||'';
/* section passwords: the server keeps the passwords; here we only hold the short-lived "unlocked" tokens it hands out */
let LOCKS={};                       // {tab:true} = has a password
let UNLOCK={};try{UNLOCK=JSON.parse(sessionStorage.getItem('ifraUnlocks')||'{}')||{};}catch(e){}
function saveUnlock(){try{sessionStorage.setItem('ifraUnlocks',JSON.stringify(UNLOCK));}catch(e){}}
const isLocked=id=>!!LOCKS[id]&&!UNLOCK[id];
async function api(path,opt){
  opt=opt||{};
  const r=await fetch('/api/admin/'+path,{method:opt.method||'GET',body:opt.body,headers:Object.assign({'Authorization':'Bearer '+TOKEN,'X-Unlocks':Object.keys(UNLOCK).map(k=>UNLOCK[k]).join(',')},opt.headers||{})});
  let j={};try{j=await r.json();}catch(e){}
  if(r.status===403&&Array.isArray(j.locked)){j.locked.forEach(t=>delete UNLOCK[t]);saveUnlock();setTimeout(draw,0);}   // unlock expired: ask for the password again
  if(r.status===401&&path!=='login'){TOKEN='';sessionStorage.removeItem('ifraToken');showGate('Session expired, please sign in again');throw new Error('auth');}
  if(!r.ok)throw new Error(j.error||('Request failed ('+r.status+')'));
  return j;
}
function showGate(msg){document.getElementById('gate').style.display='flex';document.getElementById('gateErr').textContent=msg||'';}
async function unlock(e){
  e.preventDefault();
  const btn=document.getElementById('gateBtn');btn.disabled=true;
  const username=document.getElementById('user')?document.getElementById('user').value.trim():'';
  const password=document.getElementById('pass').value;
  try{
    const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username,password})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){document.getElementById('gateErr').textContent=j.error||'Could not sign in';btn.disabled=false;return false;}
    TOKEN=j.token;sessionStorage.setItem('ifraToken',TOKEN);
    sessionStorage.setItem('ifraRole',j.role||'owner');
    sessionStorage.setItem('ifraUserName',j.name||'');
    if(Array.isArray(j.allowedTabs))sessionStorage.setItem('ifraAllowedTabs',JSON.stringify(j.allowedTabs));
    else sessionStorage.removeItem('ifraAllowedTabs');
    document.getElementById('gate').style.display='none';
    start();
  }catch(err){
    document.getElementById('gateErr').textContent='Cannot reach server. Please check your connection and try again.';
  }
  btn.disabled=false;return false;
}
function signOut(){
  TOKEN='';
  sessionStorage.removeItem('ifraToken');
  sessionStorage.removeItem('ifraRole');
  sessionStorage.removeItem('ifraUserName');
  sessionStorage.removeItem('ifraAllowedTabs');
  location.reload();
}
window.addEventListener('DOMContentLoaded',()=>{ if(TOKEN){document.getElementById('gate').style.display='none';start();} });

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){
    const v=attrs[k];
    if(k==='class')e.className=v; else if(k==='text')e.textContent=v;
    else if(k.slice(0,2)==='on')e[k]=v; else e.setAttribute(k,v);
  }
  kids.flat().forEach(c=>{ if(c!=null) e.append(c); });
  return e;
}
const clone=o=>JSON.parse(JSON.stringify(o));
let PUBLISHED=clone(window.SITE_LIVE||window.SITE_CONTENT||{});
const DEFAULTS=clone(window.SITE_CONTENT||{});
let dirty=false;
let C=null, saveT=0;
function status(t,err){const s=$('#status');s.textContent=t;s.style.color=err?'#ff8aa0':'var(--ok)';}
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    dirty=true;
    try{localStorage.setItem('ifraDraft',JSON.stringify(C));localStorage.setItem('ifraDraftDirty','1');status('● Unpublished changes (draft saved)');$('#pubTop').style.background='#ff9a3d';}
    catch(e){status('Could not save draft: '+e.message,true);}
  },300);
}
function loadDraft(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem('ifraDraft')||'null');}catch(e){}
  /* A draft is kept per device. If the live site was changed from another device (for example songs uploaded from the phone),
     an old draft here would hide those changes, so compare with what is live now. */
  const pubStr=JSON.stringify(PUBLISHED);
  let base=null,dirtyFlag=false;
  try{base=localStorage.getItem('ifraDraftBase');dirtyFlag=localStorage.getItem('ifraDraftDirty')==='1';}catch(e){}
  if(d&&base!==pubStr){
    if(base!==null&&!dirtyFlag)d=null;   /* nothing unpublished on this device: just take the live version */
    else if(confirm('The live site was changed from another device (for example your phone), so this PC has an older copy.\n\nOK = load the live version (unpublished edits made on this PC are dropped)\nCancel = keep this PC\'s draft (publishing it would overwrite the other device\'s changes)'))d=null;
  }
  if(!d){try{localStorage.removeItem('ifraDraft');localStorage.removeItem('ifraDraftDirty');localStorage.setItem('ifraDraftBase',pubStr);}catch(e){}}
  C=d||clone(PUBLISHED);
  for(const k in DEFAULTS){
    if(C[k]===undefined)C[k]=clone(DEFAULTS[k]);
    else if(!Array.isArray(DEFAULTS[k])&&typeof DEFAULTS[k]==='object')
      for(const j in DEFAULTS[k]) if(C[k][j]===undefined)C[k][j]=clone(DEFAULTS[k][j]);
  }
}

/* ---------- field builders ---------- */
function field(type,get,set,opts){
  opts=opts||{};
  const lab=el('label',{class:'f'},el('span',{text:opts.label||''}));
  let inp;
  if(type==='area')inp=el('textarea',{rows:opts.rows||3});
  else if(type==='select'){inp=el('select');opts.options.forEach(o=>inp.append(el('option',{value:o[0],text:o[1]})));}
  else inp=el('input',{type:type==='num'?'number':type==='dt'?'datetime-local':'text'});
  if(opts.rtl){inp.dir='rtl';inp.lang='ar';}
  if(opts.ph)inp.placeholder=opts.ph;
  inp.value=get();
  inp.oninput=inp.onchange=()=>{set(type==='num'?Number(inp.value):inp.value);save();if(opts.on)opts.on(inp.value);};
  lab.append(inp);return lab;
}
/* field descriptors for list items */
const F={
  self:(label,o)=>Object.assign({label,type:'text',get:(a,i)=>a[i],set:(a,i,v)=>{a[i]=v;}},o),
  key:(k,label,o)=>Object.assign({label,type:'text',get:(a,i)=>a[i][k]==null?'':a[i][k],set:(a,i,v)=>{a[i][k]=v;}},o),
  idx:(j,label,o)=>Object.assign({label,type:'text',get:(a,i)=>a[i][j],set:(a,i,v)=>{a[i][j]=v;}},o)
};

/* ---------- generic list editor ---------- */
function listEd(host,getArr,fields,mk,opts){
  opts=opts||{};
  host.innerHTML='';
  const arr=getArr();
  if(opts.search){
    const q=el('input',{type:'search',placeholder:'🔍 Search…'});
    q.oninput=()=>host.querySelectorAll('details.item').forEach(d=>{d.style.display=d.firstChild.textContent.toLowerCase().includes(q.value.toLowerCase())?'':'none';});
    host.append(q);
  }
  const changed=()=>{if(opts.onChange)opts.onChange();save();};
  const rerender=()=>listEd(host,getArr,fields,mk,opts);
  arr.forEach((_,i)=>{
    const sum=el('summary');
    const setSum=()=>{sum.textContent=(i+1)+'. '+(String(fields[0].get(arr,i)).replace(/\s+/g,' ').slice(0,80)||'(empty)');};
    setSum();
    const grid=el('div',{class:opts.grid||''});
    fields.forEach((f,fi)=>grid.append(f.render?f.render(arr,i):field(f.type,()=>f.get(arr,i),v=>{f.set(arr,i,v);if(fi===0)setSum();if(opts.onChange)opts.onChange();},
      {label:f.label,rows:f.rows,options:f.options,rtl:f.rtl,ph:f.ph})));
    const mv=d=>()=>{const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];changed();rerender();};
    const ctl=el('div',{class:'ctl'},
      el('button',{class:'b alt sm',onclick:mv(-1),text:'↑ Up'}),
      el('button',{class:'b alt sm',onclick:mv(1),text:'↓ Down'}),
      el('button',{class:'b alt sm',onclick:()=>{arr.splice(i+1,0,clone(arr[i]));changed();rerender();},text:'⧉ Duplicate'}),
      el('button',{class:'b del sm',onclick:()=>{if(confirm('Delete this item?')){arr.splice(i,1);changed();rerender();}},text:'✕ Delete'}));
    host.append(el('details',{class:'item'},sum,el('div',{class:'body'},grid,ctl)));
  });
  host.append(el('div',{class:'bar'},el('button',{class:'b',onclick:()=>{arr.push(mk());changed();rerender();const all=host.querySelectorAll('details.item');if(all.length)all[all.length-1].open=true;},text:'+ Add new'}),
    el('span',{class:'hint',text:arr.length+' items'})));
}
function listBox(getArr,fields,mk,opts){const h=el('div');listEd(h,getArr,fields,mk,opts);return h;}

/* ---------- tabs ---------- */
const TABS=[
  ['texts','📝 Page texts'],['photos','📸 Photos & captions'],['playlist','🎶 Playlist'],['when','💌 Open When'],['story','📖 Our Story'],
  ['poetry','🌙 Birthday poetry'],['surprises','🎁 Surprises'],['games','🎮 Games'],['jar','🏺 Love Jar'],['riddles','😄 Riddles'],['sweet','🧠 Sweet quiz'],
  ['proposal','Special'],['agent','🤖 Cute AI Guide'],['devices','📱 Subscribed Devices'],['plans','📅 Dates & Plans'],['diary','📖 Shared Diary'],['logins','🔐 Logins'],['sitelocks','🌐 Website locks'],['locks','🔑 Section passwords'],['settings','⚙️ Dates & delivery'],['publish','⬇ Publish']
];
let cur='texts';
function go(t){cur=t;draw();window.scrollTo(0,0);}
function getVisibleTabs(){
  const role=sessionStorage.getItem('ifraRole')||'owner';
  if(role==='her'){
    let allowed=[];
    try{allowed=JSON.parse(sessionStorage.getItem('ifraAllowedTabs')||'[]');}catch(e){}
    if(!Array.isArray(allowed)||!allowed.length){
      allowed=['texts','photos','playlist','when','story','surprises','games','jar','riddles','sweet','plans','diary'];
    }
    const forbidden=['logins','locks','sitelocks','settings'];
    return TABS.filter(t=>allowed.includes(t[0])&&!forbidden.includes(t[0]));
  }
  return TABS;
}
function draw(){
  const role=sessionStorage.getItem('ifraRole')||'owner';
  const myTabs=getVisibleTabs();
  if(!myTabs.some(t=>t[0]===cur)){
    cur=myTabs[0]?myTabs[0][0]:'texts';
  }
  const pt=$('#panelTitle');
  if(pt){
    if(role==='her')pt.textContent="🌸 Ifra's Admin Panel 💕";
    else pt.textContent="🌹 Ifra site · Admin panel";
  }
  const pubTop=$('#pubTop');
  if(pubTop){
    if(role==='her'){
      pubTop.style.display=myTabs.some(t=>t[0]==='publish')?'':'none';
    } else {
      pubTop.style.display='';
    }
  }
  const nav=$('#tabs');nav.innerHTML='';
  myTabs.forEach(t=>nav.append(el('button',{class:t[0]===cur?'on':'',onclick:()=>go(t[0]),text:(isLocked(t[0])?'🔒 ':'')+t[1]})));
  const lb=$('#lockNow');if(lb)lb.style.display=(role!=='her'&&Object.keys(LOCKS).some(k=>LOCKS[k]))?'':'none';
  const m=$('#main');m.innerHTML='';
  if(isLocked(cur))lockGate(m,cur); else if(VIEWS[cur]) VIEWS[cur](m);
}
function head(m,t,h){m.append(el('h2',{text:t}));if(h)m.append(el('p',{class:'hint',text:h}));}
function textField(m,key,label,area,rows){
  m.append(field(area?'area':'text',()=>C.text[key]==null?'':C.text[key],v=>{C.text[key]=v;},{label,rows}));
}

/* slider that stores a whole number 0-100 */
function rangeField(get,set,opts){
  const lab=el('label',{class:'f'});
  const out=el('b',{text:get()+'%'});
  const sp=el('span',{text:opts.label+'  '});sp.append(out);
  const inp=el('input',{type:'range',min:'0',max:'100',step:'1'});
  inp.style.padding='0';
  inp.value=get();
  inp.oninput=inp.onchange=()=>{out.textContent=inp.value+'%';set(Number(inp.value));save();};
  lab.append(sp,inp);
  if(opts.hint)lab.append(el('small',{class:'hint',text:opts.hint}));
  return lab;
}

/* ---------- views ---------- */
const VIEWS={};

VIEWS.texts=m=>{
  head(m,'Page texts','Every heading, paragraph and button on the main page. You can use <br> for a line break.');
  [['pageTitle','Browser tab title'],['roseName','Rose screen: name'],['roseText','Rose screen: tap hint'],
   ['mainTitle','Main title'],['subtitle','Subtitle'],['playlistTitle','Playlist heading'],['intro','Intro paragraph',1,5],
   ['letter','Opening letter',1,5],['heartNote','Heart hint (under the heart)'],
   ['galleryTitle','Gallery heading'],['galleryButton','Gallery button'],['galleryMore','Gallery footer note'],
   ['openTitle','“Open When” heading'],['openHint','“Open When” hint'],
   ['surprisesTitle','Surprises heading'],['surprisesHint','Surprises hint'],
   ['playTitle','Games heading'],['playHint','Games hint'],
   ['lastTitle','“One Last Thing” heading'],['lastHint','“One Last Thing” hint'],['questionButton','Question button'],
   ['storyButton','“Our Story” button (above the proposal button)'],
   ['installBannerTitle','Install suggestion: title'],['installBannerText','Install suggestion: text',1,2],['installBannerYes','Install suggestion: install button'],['installBannerNo','Install suggestion: “not now” button'],['remindButton','“Remind me before my birthday” button'],['installButton','“Install the app” button'],['foreverButton','“Forever Yours” button'],['careButton','“How much I care” button'],
   ['careMessage','Message shown after that button',1,4],['secretMessage','Secret message (double-tap anywhere)',1,4],
   ['birthdayTitle','Birthday scene title'],['finaleTitle','Finale (“I LOVE YOU”) title'],
   ['birthdayBanner','Countdown text on her birthday'],
   ['loveDays','“Days together” counter text. Use {d} days, {h} hours, {m} minutes']
  ].forEach(x=>textField(m,x[0],x[1],x[2],x[3]));
};

/* photos (uploaded straight to the live site) */
async function shrink(file,max,q){
  const bmp=await createImageBitmap(file);
  const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,'image/jpeg',q));
}
async function uploadPhoto(file){
  const blob=await shrink(file,1600,0.85);
  const j=await api('upload',{method:'POST',body:blob,headers:{'content-type':'image/jpeg'}});
  return j.src;
}
VIEWS.photos=m=>{
  head(m,'Photos & captions','Add, replace, reorder or delete photos and edit the caption shown under each one. New photos are shrunk and uploaded to the site right away; they appear to her after you press Publish live.');
  const host=el('div');m.append(host);
  const add=el('input',{type:'file',accept:'image/*',multiple:'multiple',style:'display:none'});
  add.onchange=async()=>{
    status('Uploading photos…');
    for(const f of add.files){try{const n=await uploadPhoto(f);C.memories.push({src:n,text:''});save();}catch(e){status('Could not add '+f.name+': '+e.message,true);}}
    render();status('Photos uploaded ✓ — press Publish live to show them');
  };
  function render(){
    host.innerHTML='';
    C.memories.forEach((mem,i)=>{
      const img=el('img',{alt:'',src:mem.src});
      const rep=el('input',{type:'file',accept:'image/*',style:'display:none'});
      rep.onchange=async()=>{if(!rep.files[0])return;try{status('Uploading…');mem.src=await uploadPhoto(rep.files[0]);img.src=mem.src;save();status('Photo replaced ✓ — press Publish live');}catch(e){status('Upload failed: '+e.message,true);}};
      const mv=d=>()=>{const j=i+d;if(j<0||j>=C.memories.length)return;[C.memories[i],C.memories[j]]=[C.memories[j],C.memories[i]];save();render();};
      host.append(el('div',{class:'photo'},img,el('div',{class:'r'},
        el('span',{class:'tag',text:'#'+(i+1)+' · '+mem.src}),
        field('area',()=>mem.text,v=>{mem.text=v;},{label:'Caption (shown under the photo)',rows:3}),
        el('div',{class:'ctl'},
          el('button',{class:'b alt sm',onclick:mv(-1),text:'↑'}),el('button',{class:'b alt sm',onclick:mv(1),text:'↓'}),
          el('button',{class:'b alt sm',onclick:()=>rep.click(),text:'Replace photo'}),rep,
          el('button',{class:'b del sm',onclick:()=>{if(confirm('Remove this photo from the gallery?')){C.memories.splice(i,1);save();render();}},text:'✕ Remove'})))));
    });
    host.append(el('div',{class:'bar'},el('button',{class:'b',onclick:()=>add.click(),text:'+ Add photos'}),add,el('span',{class:'hint',text:C.memories.length+' photos'})));
  }
  render();
};

/* ---------- audio uploads (songs & voice messages) ---------- */
const AUDIO_EXT=['m4a','mp4','mp3','aac','wav','ogg','opus','webm','weba'];
const extOf=n=>(String(n).split('.').pop()||'').toLowerCase();
const rid=()=>Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('');
async function uploadMedia(blob,ext,onProg){
  if(AUDIO_EXT.indexOf(ext)<0)throw new Error('Unsupported file type .'+ext+' (use m4a, mp3, wav, ogg, aac or webm)');
  const CH=3*1024*1024,id=rid(),total=Math.ceil(blob.size/CH);
  if(total>60)throw new Error('File too large (max about 180 MB)');
  let src='';
  for(let n=0;n<total;n++){
    const j=await api('media-chunk?id='+id+'&n='+n+'&total='+total+'&size='+blob.size+'&ext='+ext,{method:'POST',body:blob.slice(n*CH,(n+1)*CH),headers:{'content-type':'application/octet-stream'}});
    src=j.src; if(onProg)onProg((n+1)/total);
  }
  return src;
}
function pickFiles(accept,multiple,cb){
  const i=el('input',{type:'file',accept:accept,style:'display:none'});
  if(multiple)i.multiple=true;
  i.onchange=()=>{if(i.files.length)cb([...i.files]);i.remove();};

/* voice widget: upload a file, record in the browser, or remove */
function voiceWidget(get,set){
  const box=el('div',{class:'f'},el('span',{style:'display:block;font-size:12px;color:var(--mut);margin-bottom:3px',text:'Your voice for this page (optional)'}));
  const info=el('div',{class:'hint'});
  const audio=el('audio',{controls:'controls',style:'width:100%;margin:6px 0'});
  let rec=null,chunks=[],stream=null;
  const refresh=()=>{
    const v=get();
    info.textContent=v?'Voice attached ✓':'No voice yet';
    if(v){audio.src=v;audio.style.display='';}else{audio.removeAttribute('src');audio.style.display='none';}
  };
  const finish=async(blob,ext)=>{
    try{info.textContent='Uploading… 0%';const url=await uploadMedia(blob,ext,p=>{info.textContent='Uploading… '+Math.round(p*100)+'%';});set(url);save();refresh();}
    catch(e){info.textContent='Upload failed: '+e.message;}
  };
  const up=el('button',{class:'b alt sm',text:'⬆ Upload audio file',onclick:()=>pickFiles('audio/*,.m4a,.mp3,.wav,.ogg,.aac,.webm',false,fs=>finish(fs[0],extOf(fs[0].name)))});
  const recBtn=el('button',{class:'b alt sm',text:'🎙 Record now'});
  recBtn.onclick=async()=>{
    if(rec){rec.stop();return;}
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:true});
      rec=new MediaRecorder(stream);chunks=[];
      rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      rec.onstop=()=>{
        stream.getTracks().forEach(t=>t.stop());
        const type=rec.mimeType||'audio/webm';rec=null;recBtn.textContent='🎙 Record now';
        const blob=new Blob(chunks,{type});
        finish(blob,/mp4|aac/.test(type)?'m4a':/ogg/.test(type)?'ogg':'webm');
        if(/webm|ogg/.test(type))setTimeout(()=>{info.textContent+=' (Recorded as '+type.split(';')[0]+': plays on Android/Chrome. For iPhones, record with your phone’s Voice Memos app and upload the .m4a instead.)';},300);
      };
      rec.start();recBtn.textContent='⏹ Stop recording';info.textContent='Recording… speak now';
    }catch(e){info.textContent='Could not use the microphone: '+e.message;}
  };
  const rm=el('button',{class:'b del sm',text:'✕ Remove',onclick:()=>{set('');save();refresh();}});
  box.append(info,audio,el('div',{class:'ctl'},up,recBtn,rm));
  refresh();return box;
}

const GAME_TIMED=['catch','match','ttt','gtr','flight','breaker','quiz','sweet'];
const GAME_OPTS={
  catch:[{k:'seconds',label:'Round length (seconds)',def:30,min:10,max:300}],
  quiz:[{k:'questions',label:'Questions per round',def:20,min:5,max:60}],
  sweet:[{k:'questions',label:'Questions per round',def:20,min:5,max:60}],

function syncGames(){
  if(!Array.isArray(C.games))C.games=[];
  (DEFAULTS.games||[]).forEach(d=>{if(!C.games.some(x=>x.id===d.id))C.games.push(clone(d));});
  if(!C.gameMsgs)C.gameMsgs={};
  for(const k in (DEFAULTS.gameMsgs||{}))if(C.gameMsgs[k]===undefined)C.gameMsgs[k]=DEFAULTS.gameMsgs[k];
}
function gameCard(host,gm){
  const timed=GAME_TIMED.includes(gm.id);
  const sum=el('summary');
  const setSum=()=>{sum.textContent=(gm.emoji||'')+'  '+(gm.label||gm.id)+(gm.on===false?'   (hidden)':'')+((timed&&Number(gm.minutes)>0)?'   ⏳ '+gm.minutes+' min':'');};
  setSum();
  const body=el('div',{class:'body'});
  body.append(el('div',{class:'grid3'},
    field('select',()=>String(gm.on!==false),v=>{gm.on=v==='true';setSum();},{label:'Show on the site?',options:[['true','Yes, show it'],['false','No, hide it']]}),
    field('text',()=>gm.emoji||'',v=>{gm.emoji=v;setSum();},{label:'Emoji on the tile'}),
    field('text',()=>gm.label||'',v=>{gm.label=v;setSum();},{label:'Name on the tile'})));
  if(timed){
    body.append(el('div',{class:'grid2'},
      field('num',()=>gm.minutes||0,v=>{gm.minutes=Math.max(0,v||0);setSum();},{label:'How long she can play (minutes, 0 = no limit)'}),
      field('num',()=>gm.rest||0,v=>{gm.rest=Math.max(0,v||0);},{label:'Then lock it for (minutes, 0 = she can play again right away)'})));
  }
  const opts=GAME_OPTS[gm.id];
  if(opts){
    gm.opt=gm.opt||{};
    body.append(el('div',{class:opts.length>1?'grid2':''},opts.map(o=>
      field('num',()=>gm.opt[o.k]==null?o.def:gm.opt[o.k],v=>{gm.opt[o.k]=Math.max(o.min,Math.min(o.max,Math.round(v||o.def)));},{label:o.label+'  ('+o.min+' to '+o.max+', normal '+o.def+')'}))));
  }
  const move=d=>()=>{
    const idxs=C.games.map((x,i)=>x.group===gm.group?i:-1).filter(i=>i>=0);
    const pos=idxs.indexOf(C.games.indexOf(gm)),to=pos+d;
    if(to<0||to>=idxs.length)return;
    const p=idxs[pos],q=idxs[to];[C.games[p],C.games[q]]=[C.games[q],C.games[p]];save();draw();
  };
  body.append(el('div',{class:'ctl'},
    el('button',{class:'b alt sm',onclick:move(-1),text:'↑ Up'}),
    el('button',{class:'b alt sm',onclick:move(1),text:'↓ Down'}),
    el('button',{class:'b alt sm',text:'♻ Reset this one',onclick:()=>{
      const d=(DEFAULTS.games||[]).find(x=>x.id===gm.id);if(!d)return;
      if(!confirm('Put “'+(gm.label||gm.id)+'” back to its built-in settings?'))return;
      C.games[C.games.indexOf(gm)]=clone(d);save();draw();}})));
  host.append(el('details',{class:'item'},sum,body));
}

    const img = el('img', { src: cfg.customAvatarUrl, style: 'width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #ff7597;' });

VIEWS.agent=m=>{
  head(m,'🤖 Cute AI Guide & Companion','A floating cute character that guides Ifra through your site, offers interactive tours, whispers sweet notes, and answers her questions.');
  C.agent=C.agent||clone((DEFAULTS&&DEFAULTS.agent)||{});
  C.agent.tour=C.agent.tour||clone(((DEFAULTS&&DEFAULTS.agent)||{}).tour||[]);
  C.agent.notes=C.agent.notes||clone(((DEFAULTS&&DEFAULTS.agent)||{}).notes||[]);
  C.agent.qa=C.agent.qa||clone(((DEFAULTS&&DEFAULTS.agent)||{}).qa||[]);

  // 1. Live Interactive Preview
  const previewCard=el('div',{class:'card',style:'background:radial-gradient(circle at 80% 20%, rgba(255,77,109,0.18), #2a0d1a);border:1px solid #ff4d6d;'});
  previewCard.append(el('h3',{text:'✨ Live Preview'}));
  previewCard.append(el('p',{class:'hint',text:'This is how your cute guide floats and welcomes Ifra on the website:'}));

  const previewBox=el('div',{style:'position:relative;height:160px;background:#16050c;border-radius:14px;overflow:hidden;border:1px solid #4a1a30;display:flex;align-items:center;padding:16px 20px;gap:20px;'});

  function updatePreview(){
    previewBox.innerHTML='';
    const bubble=el('div',{style:'flex:1;background:rgba(30,8,20,0.92);border:1px solid rgba(255,110,140,0.4);border-radius:14px;padding:12px 14px;color:#fff0f5;font-size:13px;line-height:1.45;box-shadow:0 8px 20px rgba(0,0,0,0.5);'});
    bubble.append(el('div',{style:'font-weight:600;color:#ff7597;margin-bottom:4px;',text:(C.agent.name||'Mochi 🧚')+' says:'}));
    bubble.append(el('div',{text:C.agent.welcomeMsg||'Assalam-o-Alaikum Ifra! 🌹'}));

    const char=el('div',{style:'width:76px;height:76px;flex:none;position:relative;animation:agentBob 3.8s ease-in-out infinite;'});
    char.append(el('div',{style:'inset:-6px;position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,130,170,0.45) 0%,transparent 70%);'}));
    const avHost=el('div',{style:'width:100%;height:100%;display:flex;align-items:center;justify-content:center;'});
    renderAdminAvatar(avHost,C.agent);
    char.append(avHost);

    previewBox.append(bubble,char);
  }
  updatePreview();
  previewCard.append(previewBox);
  m.append(previewCard);

  // 2. Main Settings
  const mainCard=el('div',{class:'card'});
  mainCard.append(el('h3',{text:'⚙️ Agent Settings'}));

  const enableWrap=el('label',{class:'f',style:'display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:12px;'});
  const enableInp=el('input',{type:'checkbox',style:'width:20px;height:20px;cursor:pointer;'});
  enableInp.checked=C.agent.enabled!==false;
  enableInp.onchange=()=>{C.agent.enabled=enableInp.checked;save();updatePreview();};
  enableWrap.append(enableInp,el('b',{text:'Enable Cute AI Guide on the website'}));
  mainCard.append(enableWrap);

  mainCard.append(field('text',()=>C.agent.name||'',v=>{C.agent.name=v;updatePreview();},{label:'Agent Name (e.g. Mochi 🧚, Cupid 🏹, Lumi ✨, Chibi Tayyab)'}));

  const avLabel=el('label',{class:'f'},el('span',{text:'Agent Avatar Style'}));
  const avSelect=el('select');
  const avOptions=[
    ['fairy','🧚 Rose Fairy (Glowing wings, tiara & wand)'],
    ['bear','🧸 Cuddle Teddy (Fluffy bear hugging a red heart)'],
    ['kitty','🐱 Mochi Kitty (Sweet kitty with rose)'],
    ['bunny','🐰 Sweet Bunny (Fluffy white bunny with pink bow)'],
    ['heart','💖 Sparkle Heart (Anime glowing heart with wings)'],
    ['chick','🐥 Pip the Chick (Yellow chick with flower)'],
    ['bot','🤖 Lil Love Bot (Chibi pastel robot with antenna)'],
    ['custom','🖼️ Custom Image / Photo (Upload your own photo)']
  ];
  avOptions.forEach(o=>{
    const opt=el('option',{value:o[0],text:o[1]});
    if((C.agent.avatar||'fairy')===o[0])opt.selected=true;
    avSelect.append(opt);
  });

  const customImgWrap=el('div',{style:'margin-top:10px;'+(C.agent.avatar==='custom'?'':'display:none;')});
  const customImgInp=el('input',{type:'text',placeholder:'https://... or upload below',value:C.agent.customAvatarUrl||''});
  customImgInp.oninput=()=>{C.agent.customAvatarUrl=customImgInp.value;save();updatePreview();};

  const uploadBtn=el('input',{type:'file',accept:'image/*',style:'display:none;'});
  const pickBtn=el('button',{class:'b alt sm',text:'📁 Upload Avatar Image',style:'margin-top:6px;'});
  pickBtn.onclick=()=>uploadBtn.click();
  uploadBtn.onchange=async()=>{
    if(!uploadBtn.files.length)return;
    const f=uploadBtn.files[0];
    status('Uploading avatar…',false);
    try{
      const url=await uploadPhoto(f);
      C.agent.customAvatarUrl=url;
      customImgInp.value=url;
      save();
      updatePreview();
      status('Avatar image uploaded!',false);
    }catch(e){
      status('Upload failed: '+e.message,true);
    }
  };
  customImgWrap.append(el('span',{class:'hint',text:'Custom Avatar Image URL or File:'}),customImgInp,pickBtn,uploadBtn);

  avSelect.onchange=()=>{
    C.agent.avatar=avSelect.value;
    customImgWrap.style.display=C.agent.avatar==='custom'?'block':'none';
    save();
    updatePreview();
  };
  avLabel.append(avSelect,customImgWrap);
  mainCard.append(avLabel);

  const persOpts=[
    ['sweet','Sweet & Loving (Gentle compliments, warm affection)'],
    ['playful','Playful & Cute (Bubbly, energetic, fun)'],
    ['caring','Gentle & Caring (Calming, protective, peaceful)'],
    ['poetic','Poetic & Romantic (Urdu & English poetry expressions)']
  ];
  mainCard.append(field('select',()=>C.agent.personality||'sweet',v=>{C.agent.personality=v;},{label:'Personality Style',options:persOpts}));

  mainCard.append(field('area',()=>C.agent.welcomeMsg||'',v=>{C.agent.welcomeMsg=v;updatePreview();},{label:'Opening Greeting Bubble (what the agent says when Ifra arrives)',rows:3}));

  const ambientWrap=el('label',{class:'f',style:'display:flex;align-items:center;gap:10px;cursor:pointer;margin:8px 0;'});
  const ambientInp=el('input',{type:'checkbox',style:'width:18px;height:18px;'});
  ambientInp.checked=C.agent.ambientTips!==false;
  ambientInp.onchange=()=>{C.agent.ambientTips=ambientInp.checked;save();};
  ambientWrap.append(ambientInp,el('span',{text:'Show gentle floating speech tips when she scrolls near sections (Memories, Letters, Surprises, Games)'}));
  mainCard.append(ambientWrap);

  const soundWrap=el('label',{class:'f',style:'display:flex;align-items:center;gap:10px;cursor:pointer;margin:8px 0;'});
  const soundInp=el('input',{type:'checkbox',style:'width:18px;height:18px;'});
  soundInp.checked=C.agent.sound!==false;
  soundInp.onchange=()=>{C.agent.sound=soundInp.checked;save();};
  soundWrap.append(soundInp,el('span',{text:'Play sweet fairy chime sound effect when the agent is tapped'}));
  mainCard.append(soundWrap);

  const posOpts=[
    ['bottom-right','Bottom Right corner (Default)'],
    ['bottom-left','Bottom Left corner']
  ];
  mainCard.append(field('select',()=>C.agent.position||'bottom-right',v=>{C.agent.position=v;},{label:'Default Screen Corner',options:posOpts}));

  m.append(mainCard);

  // 3. Tour Stops
  const tourCard=el('div',{class:'card'});
  tourCard.append(el('h3',{text:'🗺️ Guided Tour Stops'}));
  tourCard.append(el('p',{class:'hint',text:'When she taps “✨ Take Me on a Tour”, the agent guides her step-by-step through each of these stops with a glowing spotlight:'}));

  const sectionOptions=[
    ['.card','🌹 Welcome / Main Card'],
    ['.song-section','🎶 Playlist Section'],
    ['#letter','💌 The Unfolding Letter'],
    ['#remindBtn','🎂 Birthday Reminders Button'],
    ['.gallery-section','📸 Memories Gallery'],
    ['.letters-section','💌 Open When Letters'],
    ['.surprises-section','🎁 Little Surprises'],
    ['.tile-grid.three','🎮 Play Together Games'],
    ['.proposal-section','💍 The Question / Proposal']
  ];

  const tourFields=[
    F.key('title','Stop Title'),
    F.key('target','Target Section to Highlight',{type:'select',options:sectionOptions}),
    F.key('text','What the agent says at this stop',{type:'area',rows:2})
  ];
  tourCard.append(listBox(()=>C.agent.tour,tourFields,()=>({id:'stop_'+Date.now(),target:'.card',title:'New Stop',text:'Look at this special section made with love!'}),{grid:'grid2'}));
  m.append(tourCard);

  // 4. Love Notes
  const notesCard=el('div',{class:'card'});
  notesCard.append(el('h3',{text:'💌 Sweet Whispers & Love Notes'}));
  notesCard.append(el('p',{class:'hint',text:'When she taps “💌 Love Note”, the agent whispers one of these sweet thoughts from your heart:'}));
  notesCard.append(listBox(()=>C.agent.notes,[F.self('Love Note',{type:'area',rows:2})],()=>'Ifra, your smile is my favourite sight in the whole world ❤️'));

VIEWS.devices=m=>{
  head(m,'📱 Subscribed Devices for Birthday Reminders','See what phones, tablets, and computers have enabled birthday reminder notifications. Inspect device models, rename them (e.g. “Ifra’s iPhone 15 Pro”), and test notification delivery to individual devices.');

  const card=el('div',{class:'card'});
  const statusMsg=el('p',{class:'hint',text:'Loading registered devices…'});
  const listWrap=el('div',{style:'margin-top:14px;'});

  const refreshBtn=el('button',{class:'b alt sm',text:'🔄 Refresh Devices'});
  const testAllBtn=el('button',{class:'b sm',text:'🔔 Send Test Push to ALL Devices',style:'margin-left:8px;'});

  const bar=el('div',{class:'bar'},refreshBtn,testAllBtn);
  card.append(bar,statusMsg,listWrap);
  m.append(card);

  async function loadDevices(){
    statusMsg.textContent='Fetching subscribed devices from server…';
    listWrap.innerHTML='';
    try{
      const res=await api('push-info');
      const devs=res.devices||[];
      statusMsg.innerHTML='<b>'+devs.length+' device(s)</b> subscribed · <b>'+res.daysLeft+' days</b> until birthday.';
      if(!devs.length){
        listWrap.append(el('div',{style:'background:#12040b;border:1px dashed #4a1a30;border-radius:12px;padding:24px;text-align:center;'},
          el('div',{style:'font-size:32px;margin-bottom:8px;',text:'📱'}),
          el('h4',{style:'margin:0 0 6px;color:#ffb3c4;',text:'No devices have turned on reminders yet'}),
          el('p',{class:'hint',style:'margin:0 auto;max-width:440px;',text:'When Ifra (or you) taps “Remind me before my birthday” on the website, her phone model (e.g. iPhone 15 Pro or Samsung Galaxy), device name, and push specs will automatically appear here!'})
        ));
        return;
      }

      devs.forEach((d,idx)=>{
        const item=el('div',{class:'card',style:'background:#19060f;border:1px solid #4a1a30;margin:10px 0;padding:14px;position:relative;'});

        const headRow=el('div',{style:'display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;'});
        const titleArea=el('div',{style:'display:flex;align-items:center;gap:10px;'});
        const icon=el('span',{style:'font-size:26px;',text:d.type==='desktop'?'💻':(d.type==='tablet'?'📱':'📱')});
        const nameBlock=el('div');
        const nameHeading=el('h4',{style:'margin:0;font-size:16px;color:#fff;',text:d.name||('Device #'+(idx+1))});
        const subSpecs=el('span',{style:'font-size:12px;color:var(--mut);',text:(d.model!=='Unknown Model'?d.model+' · ':'')+d.os+' ('+d.browser+')'});
        nameBlock.append(nameHeading,subSpecs);
        titleArea.append(icon,nameBlock);

        const badges=el('div',{style:'display:flex;gap:6px;flex-wrap:wrap;'});
        if(d.isStandalone)badges.append(el('span',{class:'tag',style:'background:#204020;color:#6ee7b7;',text:'📲 Home Screen App'}));
        else badges.append(el('span',{class:'tag',text:'🌐 Browser'}));
        if(d.pushProvider)badges.append(el('span',{class:'tag',style:'background:#3d1a2c;color:#ff9ab0;',text:d.pushProvider}));
        if(d.screen)badges.append(el('span',{class:'tag',text:d.screen}));
        headRow.append(titleArea,badges);

        const grid=el('div',{class:'grid2',style:'font-size:12.5px;color:var(--mut);margin:8px 0;padding:8px 0;border-top:1px solid #2d0d1c;border-bottom:1px solid #2d0d1c;'});
        const subDate=d.subscribedAt?new Date(d.subscribedAt).toLocaleString():'Earlier visit';
        const lastDate=d.lastSeenAt?new Date(d.lastSeenAt).toLocaleString():'Recently';
        grid.append(
          el('div',el('span',{text:'Subscribed: '}),el('b',{style:'color:#fff;',text:subDate})),
          el('div',el('span',{text:'Last active: '}),el('b',{style:'color:#fff;',text:lastDate}))
        );

        const actBar=el('div',{class:'bar',style:'margin-top:10px;justify-content:flex-end;'});
        const testBtn=el('button',{class:'b alt sm',text:'🔔 Test this device'});
        testBtn.onclick=async()=>{
          testBtn.disabled=true;
          statusMsg.textContent='Sending test notification to '+d.name+'…';
          try{
            const r=await api('push-device-test',{
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify({id:d.id,endpoint:d.endpoint,settings:C.settings})
            });
            statusMsg.textContent='✅ Notification sent successfully to '+(r.targetName||d.name)+'! Preview: “'+r.preview.title+'”';
          }catch(e){
            statusMsg.textContent='❌ Test failed for '+d.name+': '+e.message;
          }
          testBtn.disabled=false;
        };

        const renameBtn=el('button',{class:'b alt sm',text:'✏️ Rename'});
        renameBtn.onclick=async()=>{
          const newName=prompt('Enter a friendly name for this device (e.g. "Ifra\'s Pink Phone"):',d.name||'');
          if(newName&&newName.trim()){
            try{
              await api('push-device-rename',{
                method:'POST',
                headers:{'content-type':'application/json'},
                body:JSON.stringify({id:d.id,endpoint:d.endpoint,name:newName.trim()})
              });
              loadDevices();
            }catch(e){
              alert('Could not rename: '+e.message);
            }
          }
        };

        const delBtn=el('button',{class:'b del sm',text:'🗑️ Remove'});
        delBtn.onclick=async()=>{
          if(confirm('Are you sure you want to remove '+(d.name||'this device')+'? Reminders will no longer be delivered to this phone.')){
            try{
              await api('push-device-delete',{
                method:'POST',
                headers:{'content-type':'application/json'},
                body:JSON.stringify({id:d.id,endpoint:d.endpoint})
              });
              loadDevices();
            }catch(e){
              alert('Could not remove: '+e.message);
            }
          }
        };

        actBar.append(testBtn,renameBtn,delBtn);
        item.append(headRow,grid,actBar);
        listWrap.append(item);
      });
    }catch(err){
      if(err.message!=='auth')statusMsg.textContent='Could not load devices: '+err.message;
    }
  }

  refreshBtn.onclick=loadDevices;
  testAllBtn.onclick=async()=>{
    testAllBtn.disabled=true;
    statusMsg.textContent='Sending test notification to all subscribed devices…';
    try{
      const r=await api('push-test',{
        method:'POST',
        headers:{'content-type':'application/json'},
        body:JSON.stringify({settings:C.settings})
      });
      const x=r.result;
      statusMsg.textContent='✅ Sent to '+x.sent+' of '+x.total+' device(s).'+(x.failed?' ('+x.failed+' failed)':'')+' Preview: “'+r.preview.title+'”';
    }catch(e){
      if(e.message!=='auth')statusMsg.textContent='Push test failed: '+e.message;
    }
    testAllBtn.disabled=false;
  };

  loadDevices();
};

  cfgCard.append(field('area', () => C.planner.subtitle || '', v => { C.planner.subtitle = v; }, { label: 'Modal Subtitle / Description', rows: 2 }));

  cfgCard.append(field('text', () => C.planner.valorantModes || 'Competitive 🏆, Swiftplay ⚡, Spike Rush 💥, Unrated 🎯, Custom 1v1 ⚔️', v => { C.planner.valorantModes = v; }, { label: 'Valorant Game Modes (comma-separated list shown when Valorant is selected)' }));

  m.append(cfgCard);

  // 2. Success Screen Customization
  const successCard = el('div', {class:'card'});
  successCard.append(el('h3', {style:'margin-top:0', text:'🎉 Confirmation & Success Screen'}));
  successCard.append(el('p', {class:'hint', text:'What Ifra sees in the popup right after she hits send:'}));
  successCard.append(field('text', () => C.planner.successTitle || 'Plan Sent to Tayyab!', v => { C.planner.successTitle = v; }, { label: 'Success Heading' }));
  successCard.append(field('text', () => C.planner.successSubtitle || 'Your plan has been sent straight to his phone and devices! 📲', v => { C.planner.successSubtitle = v; }, { label: 'Success Subtitle' }));
  successCard.append(field('area', () => C.planner.successHint || 'He will receive an instant notification alert on his phone so you two can enjoy your time together! 💕', v => { C.planner.successHint = v; }, { label: 'Success Hint Message', rows: 2 }));
  m.append(successCard);

  // 3. Activities / Plan Types Card
  const actCard = el('div', {class:'card'});
  actCard.append(el('h3', {style:'margin-top:0', text:'🎯 Date Activities & Plan Types'}));
  actCard.append(el('p', {class:'hint', text:'Customize what types of dates & activities she can pick from. You can add new ones, rename existing ones, reorder them, or toggle them on/off:'}));

  const actFields = [
    F.key('label', 'Activity Label (e.g. Valorant Date, Movie Night)'),
    F.key('icon', 'Icon / Emoji (e.g. 🎮, 🎬, ☕, 🍕)'),
    F.key('id', 'Type ID (e.g. valorant, movie, call, dinner, custom)'),
    F.key('enabled', 'Visibility', {
      type: 'select',
      options: [['true', '✅ Show on Website'], ['false', '❌ Hide from Website']],
      get: (a, i) => a[i].enabled !== false ? 'true' : 'false',
      set: (a, i, v) => { a[i].enabled = v === 'true'; }
    })
  ];
  actCard.append(listBox(() => C.planner.activities, actFields, () => ({
    id: 'activity_' + Date.now(),
    label: 'New Date Idea',
    icon: '✨',
    enabled: true
  }), { grid: 'grid2' }));
  m.append(actCard);

  // 4. Quick Time Slots Card
  const slotsCard = el('div', {class:'card'});
  slotsCard.append(el('h3', {style:'margin-top:0', text:'⏰ Time Slots & Hours'}));
  slotsCard.append(el('p', {class:'hint', text:'Quick time buttons that she can tap to choose the scheduled time (24-hour format HH:MM):'}));

  const slotFields = [
    F.key('label', 'Button Label (e.g. ⚡ 9:30 PM (Valorant Time))'),
    F.key('time', '24h Time format HH:MM (e.g. 21:30)')
  ];
  slotsCard.append(listBox(() => C.planner.timeSlots, slotFields, () => ({
    label: '⏰ 8:00 PM',
    time: '20:00'
  }), { grid: 'grid2' }));
  m.append(slotsCard);

  // 5. Received Scheduled Plans Card
  const plansCard = el('div', {class:'card', id:'receivedPlansCard'});
  plansCard.append(el('h3', {style:'margin-top:0', text:'📬 Scheduled Plans Received from Ifra'}));
  const statusMsg = el('p', {class:'hint', text:'Loading plans…'});
  const listWrap = el('div', {style:'margin-top:14px;'});

  const refreshBtn = el('button', {class:'b alt sm', text:'🔄 Refresh Plans'});
  const clearAllBtn = el('button', {class:'b del sm', text:'🗑️ Clear All Plans', style:'margin-left:8px;'});

  const bar = el('div', {class:'bar'}, refreshBtn, clearAllBtn);
  plansCard.append(bar, statusMsg, listWrap);
  m.append(plansCard);

  async function loadPlans(){
    statusMsg.textContent='Fetching plans from server…';
    listWrap.innerHTML='';
    try{
      const res=await api('plans');
      const plans=res.plans||[];
      statusMsg.innerHTML='<b>'+plans.length+' plan(s)</b> scheduled by Ifra.';
      if(!plans.length){
        listWrap.append(el('div',{style:'background:#12040b;border:1px dashed #4a1a30;border-radius:12px;padding:28px 20px;text-align:center;'},
          el('div',{style:'font-size:36px;margin-bottom:8px;',text:'📅🎮'}),
          el('h4',{style:'margin:0 0 6px;color:#ffb3c4;',text:'No plans scheduled yet'}),
          el('p',{class:'hint',style:'margin:0 auto;max-width:440px;',text:'When Ifra opens “Plan a Date” or “Valorant Date” on the website and selects a date and time, her plan will show up here, and you will get an instant alert on your phone via ntfy, Discord, and Web Push!'})
        ));
        return;
      }

      plans.forEach(p=>{
        const item=el('div',{class:'card',style:'background:#19060f;border:1px solid '+(p.status==='confirmed'?'#4cc38a':'#ff4d6d')+';margin:12px 0;padding:16px;'});

        let icon='📅';
        if(p.planType==='valorant')icon='🎮';
        else if(p.planType==='movie')icon='🎬';
        else if(p.planType==='call')icon='☕';
        else if(p.planType==='dinner')icon='🍕';
        else icon='🌸';

        const headRow=el('div',{style:'display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;'});
        const titleArea=el('div',{style:'display:flex;align-items:center;gap:12px;'});
        titleArea.append(el('span',{style:'font-size:32px;',text:icon}));
        const nameBlock=el('div');
        nameBlock.append(
          el('h4',{style:'margin:0;font-size:17px;color:#fff;',text:p.title+(p.subType?' · '+p.subType:'')}),
          el('span',{style:'font-size:12px;color:var(--mut);',text:'Received: '+(p.createdAt?new Date(p.createdAt).toLocaleString():'Recently')})
        );
        titleArea.append(nameBlock);

        const statusTag=el('span',{class:'tag',style:p.status==='confirmed'?'background:#204020;color:#6ee7b7;':'background:#7a1d33;color:#ffcad4;',text:p.status==='confirmed'?'✅ Confirmed with Ifra':'🔔 New / Pending'});
        headRow.append(titleArea,statusTag);

        const scheduleBox=el('div',{style:'display:flex;gap:16px;flex-wrap:wrap;background:rgba(255,77,109,0.1);border-radius:10px;padding:10px 14px;margin:10px 0;border:1px solid rgba(255,77,109,0.25);'});
        scheduleBox.append(
          el('div',el('span',{style:'font-size:11.5px;color:var(--mut);display:block;',text:'SCHEDULED DATE'}),el('b',{style:'font-size:15px;color:#ffe6ee;',text:'📅 '+(p.dateFormatted||p.date)})),
          el('div',el('span',{style:'font-size:11.5px;color:var(--mut);display:block;',text:'SCHEDULED TIME'}),el('b',{style:'font-size:15px;color:#ffe6ee;',text:'⏰ '+(p.timeFormatted||p.time)}))
        );

        const noteBox=p.note?el('div',{style:'font-size:13.5px;color:#fff;background:rgba(0,0,0,0.3);border-radius:8px;padding:10px 12px;margin:8px 0;border-left:3px solid #ff4d6d;'},
          el('span',{style:'font-size:11px;color:var(--mut);display:block;margin-bottom:3px;',text:'HER NOTE:'}),
          el('div',{style:'font-style:italic;',text:'“'+p.note+'”'})
        ):null;

        const actBar=el('div',{class:'bar',style:'margin-top:12px;justify-content:flex-end;'});
        const confirmBtn=el('button',{class:'b sm',style:p.status==='confirmed'?'background:#2a4a35;':'background:#4cc38a;',text:p.status==='confirmed'?'Mark as Pending ↩️':'Ready! Confirm Plan ✅'});
        confirmBtn.onclick=async()=>{
          confirmBtn.disabled=true;
          try{
            await api('plans-status',{
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify({id:p.id,status:p.status==='confirmed'?'pending':'confirmed'})
            });
            loadPlans();
          }catch(e){
            alert('Could not update status: '+e.message);
          }
        };

        const delBtn=el('button',{class:'b del sm',text:'🗑️ Delete'});
        delBtn.onclick=async()=>{
          if(confirm('Delete this plan for '+(p.title||'date')+'?')){
            try{
              await api('plans-delete',{
                method:'POST',
                headers:{'content-type':'application/json'},
                body:JSON.stringify({id:p.id})
              });
              loadPlans();
            }catch(e){
              alert('Could not delete: '+e.message);
            }
          }
        };

        actBar.append(confirmBtn,delBtn);
        item.append(headRow,scheduleBox);
        if(noteBox)item.append(noteBox);
        item.append(actBar);
        listWrap.append(item);
      });
    }catch(err){
      if(err.message!=='auth')statusMsg.textContent='Could not load plans: '+err.message;
    }
  }

  refreshBtn.onclick=loadPlans;
  clearAllBtn.onclick=async()=>{
    if(confirm('Are you sure you want to delete all scheduled plans?')){
      try{
        await api('plans-delete',{
          method:'POST',
          headers:{'content-type':'application/json'},
          body:JSON.stringify({all:true})
        });
        loadPlans();
      }catch(e){
        alert('Could not clear plans: '+e.message);
      }
    }
  };

  loadPlans();
};

        );
        titleArea.append(nameBlock);
        headRow.append(titleArea);

        const textBox=el('div',{style:'font-size:14px;color:#fbe9ef;background:rgba(0,0,0,0.35);border-radius:10px;padding:14px;margin:10px 0;border-left:3px solid #ba68c8;line-height:1.65;white-space:pre-wrap;font-style:italic;',text:e.text});

        const actBar=el('div',{class:'bar',style:'margin-top:10px;justify-content:flex-end;'});
        const delBtn=el('button',{class:'b del sm',text:'🗑️ Delete Page'});
        delBtn.onclick=async()=>{
          if(confirm('Delete this shared page from your admin panel?')){
            try{
              await api('diary-delete',{
                method:'POST',
                headers:{'content-type':'application/json'},
                body:JSON.stringify({id:e.id})
              });
              loadDiary();
            }catch(err){
              alert('Could not delete: '+err.message);
            }
          }
        };

        actBar.append(delBtn);
        item.append(headRow,textBox,actBar);
        listWrap.append(item);
      });
    }catch(err){
      if(err.message!=='auth')statusMsg.textContent='Could not load diary pages: '+err.message;
    }
  }

  refreshBtn.onclick=loadDiary;
  clearAllBtn.onclick=async()=>{
    if(confirm('Are you sure you want to delete all shared diary pages?')){
      try{
        await api('diary-delete',{
          method:'POST',
          headers:{'content-type':'application/json'},
          body:JSON.stringify({all:true})
        });
        loadDiary();
      }catch(err){
        alert('Could not clear diary pages: '+err.message);
      }
    }
  };

  loadDiary();
};

/* ---------- logins (saved straight to the server, not part of the draft / Publish) ---------- */
VIEWS.logins=m=>{
  head(m,'Logins','Manage two separate login systems. The "Website Logins" protect the private gallery, Our Story and proposal on the site. The "Admin Panel Login" is a separate login just for Ifra to access this admin panel — it has nothing to do with the website content gates.');
  const host=el('div');m.append(host);
  host.append(el('p',{class:'hint',text:'Loading…'}));
  const roles=[['me','👤 Your login (website)','Use this to look at the private parts of the website yourself, or to test the proposal. Her answer is NOT sent to you while you are logged in as yourself.'],
               ['her','💖 Her website login','Give her this username and password. She is asked for it when she opens the gallery, Our Story or the proposal on the main site. This is NOT her admin panel login.']];
  async function load(){
    let u;
    try{u=await api('users');}catch(e){host.innerHTML='';host.append(el('p',{class:'hint',text:'Could not load: '+e.message}));return;}
    host.innerHTML='';

    // ---- Section 1: Website Content Logins ----
    host.append(el('h3',{text:'🌐 Website Content Logins'}));
    const any=!!(u.me||u.her);

/* ---------- 🔑 section passwords (kept and checked on the server) ---------- */
const jsonHdr={'content-type':'application/json'};
const lockApi=body=>api('locks',{method:'POST',headers:jsonHdr,body:JSON.stringify(body)});
async function refreshLocks(){LOCKS=(await api('locks')).locks||{};}
function lockNow(){UNLOCK={};saveUnlock();draw();status('Everything locked 🔒');}

function lockGate(m,id){
  const t=TABS.find(x=>x[0]===id);
  const pw=el('input',{type:'password',autocomplete:'off',placeholder:'Password for this section'});
  const msg=el('p',{style:'color:#ff8aa0;min-height:20px;margin:8px 0'});
  const btn=el('button',{class:'b',text:'🔓 Unlock'});
  async function tryUnlock(){
    if(!pw.value)return;
    btn.disabled=true;msg.textContent='';
    try{
      const r=await lockApi({action:'unlock',tab:id,password:pw.value});
      if(r.token)UNLOCK[id]=r.token;else LOCKS[id]=false;
      saveUnlock();draw();
    }catch(e){if(e.message!=='auth'){msg.textContent=e.message;pw.value='';btn.disabled=false;pw.focus();}}
  }
  btn.onclick=tryUnlock;pw.onkeydown=e=>{if(e.key==='Enter')tryUnlock();};
  const fMsg=el('p',{class:'hint',style:'margin:6px 0'});
  const fPw=el('input',{type:'password',autocomplete:'off',placeholder:'Your main admin password'});
  const fBtn=el('button',{class:'b alt sm',text:'Remove this lock'});
  fBtn.onclick=async()=>{
    fBtn.disabled=true;fMsg.style.color='';fMsg.textContent='Checking…';
    try{await lockApi({action:'forgot',tab:id,adminPassword:fPw.value});LOCKS[id]=false;draw();status('Lock removed. Set a new one in 🔑 Section passwords');}
    catch(e){if(e.message!=='auth'){fMsg.style.color='#ff8aa0';fMsg.textContent=e.message;fBtn.disabled=false;}}
  };
  const forgot=el('div',{style:'display:none;margin-top:10px'},el('p',{class:'hint',text:'Enter your main admin password (the one from the sign-in screen) to remove this lock.'}),fPw,fMsg,fBtn);
  const fl=el('button',{class:'b alt sm',style:'margin-top:12px',text:'Forgot password?',onclick:()=>{forgot.style.display=forgot.style.display==='none'?'':'none';}});
  m.append(el('div',{class:'card',style:'max-width:420px;margin:30px auto;text-align:center'},
    el('h2',{text:'🔒 '+(t?t[1]:id)}),
    el('p',{class:'hint',text:'This section is locked. Type its password to open and edit it.'}),
    pw,msg,btn,el('div'),fl,forgot));
  setTimeout(()=>{try{pw.focus();}catch(e){}},50);
}

VIEWS.locks=m=>{
  head(m,'Section passwords','Pick which parts of this admin panel need a password before they open (for example Photos, Proposal or Publish). The passwords are kept on the server, so they work from any phone or computer, and the server refuses to save changes to a locked section without its password. If you forget one, tap “Forgot password?” on its lock screen and enter your main admin password.');
  const host=el('div');m.append(host);
  host.append(el('p',{class:'hint',text:'Loading…'}));
  async function render(){
    try{await refreshLocks();}catch(e){host.innerHTML='';host.append(el('p',{class:'hint',text:'Could not load: '+e.message}));return;}
    host.innerHTML='';
    const aPw=el('input',{type:'password',autocomplete:'new-password',placeholder:'One password (min 4 characters)'});
    const aMsg=el('p',{class:'hint'});
    const aBtn=el('button',{class:'b',text:'🔒 Lock every section with this password'});
    aBtn.onclick=async()=>{
      aMsg.style.color='#ff8aa0';aMsg.textContent='';
      try{
        const r=await lockApi({action:'setAll',password:aPw.value});
        Object.assign(UNLOCK,r.tokens||{});saveUnlock();await refreshLocks();draw();
        status('Locked '+r.count+' section(s) 🔒');
      }catch(e){if(e.message!=='auth')aMsg.textContent=e.message;}
    };
    host.append(el('div',{class:'card'},el('h3',{style:'margin-top:0',text:'🔐 One password for everything'}),
      el('p',{class:'hint',text:'Quick way: puts the same password on every section that has no password yet. You can still give a section its own password below.'}),
      aPw,aMsg,el('div',{class:'ctl'},aBtn,el('button',{class:'b alt',text:'🔒 Lock now (ask again for everything)',onclick:lockNow}))));
    host.append(el('h3',{text:'Each section'}));
    TABS.forEach(t=>{
      const id=t[0],has=!!LOCKS[id];
      const cur=has?el('input',{type:'password',autocomplete:'off',placeholder:'Current password'}):null;
      const nw=el('input',{type:'password',autocomplete:'new-password',placeholder:has?'New password (min 4 characters)':'Set a password (min 4 characters)'});
      const msg=el('p',{class:'hint'});
      const fail=e=>{if(e.message!=='auth'){msg.style.color='#ff8aa0';msg.textContent=e.message;}};
      const sv=el('button',{class:'b sm',text:has?'💾 Change password':'🔒 Lock this section'});
      sv.onclick=async()=>{
        try{
          const r=await lockApi({action:'set',tab:id,password:nw.value,current:cur?cur.value:''});
          UNLOCK[id]=r.token;saveUnlock();await refreshLocks();draw();status('Saved 🔒');
        }catch(e){fail(e);}
      };
      const ctl=[sv];
      if(has)ctl.push(el('button',{class:'b del sm',text:'✕ Remove password',onclick:async()=>{
        try{await lockApi({action:'remove',tab:id,current:cur.value});delete UNLOCK[id];saveUnlock();await refreshLocks();draw();status('Password removed');}
        catch(e){fail(e);}
      }}));
      host.append(el('details',{class:'item'},el('summary',{text:t[1]+(has?'   🔒 password set':'   🔓 no password')}),
        el('div',{class:'body'},cur?el('label',{class:'f'},el('span',{text:'Current password'}),cur):null,
          el('label',{class:'f'},el('span',{text:has?'New password':'Password'}),nw),el('div',{class:'ctl'},ctl),msg)));
    });
  }
  render();
};

    field('text',()=>C.settings.discordWebhook,v=>{C.settings.discordWebhook=v;},{label:'Discord webhook URL (optional)'}),
    field('text',()=>C.settings.instagram,v=>{C.settings.instagram=v;},{label:'Instagram username (fallback “Open DM” button)'}),
    field('text',()=>C.settings.whatsapp,v=>{C.settings.whatsapp=v;},{label:'WhatsApp number with country code, no + (optional)'})));
  m.append(el('div',{class:'card'},el('h3',{text:'💬 More ways she can message you'}),
    el('p',{class:'hint',text:'Fill in any you like. In “Write Back To Me” (and after she says yes) she gets a button for each one you add, plus the phone’s share menu. Leave a field empty to hide that option. Instagram and WhatsApp are set above.'}),
    field('text',()=>C.settings.telegram||'',v=>{C.settings.telegram=v;},{label:'Telegram username (without @)'}),
    field('text',()=>C.settings.email||'',v=>{C.settings.email=v;},{label:'Email address'}),
    field('text',()=>C.settings.sms||'',v=>{C.settings.sms=v;},{label:'Phone number for text messages (with country code, e.g. +923001234567)'})));
};

/* ---------- publish ---------- */
function download(blob,name){const a=el('a',{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}
const contentJs=()=>'window.SITE_CONTENT = '+JSON.stringify(C,null,2)+';\n';
function privateOf(){return {ntfyTopic:C.settings.ntfyTopic||'',discordWebhook:C.settings.discordWebhook||''};}
async function publish(){
  if(isLocked('publish')){go('publish');status('Enter the Publish password first',true);return;}
  clearTimeout(saveT);const b=$('#pubTop');b.disabled=true;status('Publishing…');
  try{
    await api('save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content:C,private:privateOf()})});
    dirty=false;b.style.background='';
    try{localStorage.setItem('ifraDraft',JSON.stringify(C));localStorage.setItem('ifraDraftBase',JSON.stringify(C));localStorage.removeItem('ifraDraftDirty');}catch(e){}
    status('Published ✓ Live now '+new Date().toLocaleTimeString());
  }catch(e){if(e.message!=='auth')status('Publish failed: '+e.message,true);}
  b.disabled=false;
}
function preview(){
  try{localStorage.setItem('ifraDraft',JSON.stringify(C));}catch(e){}
  window.open('index.html?preview=1','_blank');
}
VIEWS.publish=m=>{
  head(m,'Publish your changes');
  m.append(el('div',{class:'card'},
    el('p',{text:'Your edits are saved as a draft in this browser while you work. Nothing changes for her until you press Publish live.'}),
    el('div',{class:'bar'},
      el('button',{class:'b alt',onclick:preview,text:'👁 Preview draft'}),
      el('button',{class:'b',onclick:publish,text:'🚀 Publish live'}),
      el('button',{class:'b alt',onclick:()=>download(new Blob([contentJs()],{type:'text/javascript'}),'content-backup.js'),text:'Download backup'}))));
  m.append(el('div',{class:'card'},el('h3',{text:'Start over'}),
    el('p',{class:'hint',text:'Discard your draft and reload what is live right now.'}),
    el('button',{class:'b alt',onclick:()=>{if(confirm('Discard all unpublished edits?')){localStorage.removeItem('ifraDraft');location.reload();}},text:'Discard draft'}),
    el('p',{class:'hint',style:'margin-top:16px',text:'Or put the whole site back to its original built-in content (your photos stay stored but are removed from the gallery).'}),
    el('button',{class:'b del',onclick:async()=>{if(!confirm('Reset the live site to the original content?'))return;try{await api('reset',{method:'POST'});localStorage.removeItem('ifraDraft');location.reload();}catch(e){if(e.message!=='auth')status(e.message,true);}},text:'Reset live site to original'})));
};

async function start(){
  const role=sessionStorage.getItem('ifraRole')||'owner';
  const pt=$('#panelTitle');
  if(pt){
    if(role==='her')pt.textContent="🌸 Ifra's Admin Panel 💕";
    else pt.textContent="🌹 Ifra site · Admin panel";
  }
  // the public script hides the private parts once logins are on, so ask the server for the full saved content
  try{const f=await api('content');if(f&&f.content)PUBLISHED=clone(f.content);}catch(e){if(e.message==='auth')return;}
  if(role!=='her'){
    try{LOCKS=(await api('locks')).locks||{};}catch(e){if(e.message==='auth')return;}
  } else {
    LOCKS={};
  }
  loadDraft();
  if(role!=='her'){
    try{
      const p=await api('private');
      ['ntfyTopic','discordWebhook'].forEach(k=>{ if(!C.settings[k]) C.settings[k]=p[k]||''; });
    }catch(e){ if(e.message==='auth')return; }
  }
  draw();
  if(role==='her'){
    const herName=sessionStorage.getItem('ifraUserName')||'Ifra';
    status('🌸 Welcome ' + herName + '! Ready to edit 💕');
  }
}
</script>
</body>
